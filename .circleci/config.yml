# Continuous integration (CircleCI). Runs on every push to any branch, including PR branches.
# No orbs: everything is plain shell, so the pipeline is easy to read and to run locally.
# Placeholders only — CI never talks to a real API and holds no deployment secrets.
version: 2.1

executors:
  node:
    docker:
      # Same Node version as .nvmrc and the production images.
      - image: node:24.22.0-trixie
    resource_class: medium
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
      EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1

commands:
  install:
    description: Install the pnpm version from package.json and the locked dependencies
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: corepack enable && pnpm --version
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: |
            pnpm config set store-dir ~/.pnpm-store
            pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths: [~/.pnpm-store]

jobs:
  quality:
    executor: node
    steps:
      - install
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run:
          name: Build web and API
          command: pnpm build

  api-e2e:
    docker:
      - image: node:24.22.0-trixie
        environment:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_NAME: vtp_ci
          DATABASE_USER: vtp
          DATABASE_PASSWORD: ci-only-not-a-secret
          AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
          E2E_EXPECT_DATABASE: 'true'
          TURBO_TELEMETRY_DISABLED: '1'
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - image: postgis/postgis:18-3.6
        environment:
          POSTGRES_DB: vtp_ci
          POSTGRES_USER: vtp
          POSTGRES_PASSWORD: ci-only-not-a-secret
    resource_class: medium
    steps:
      - install
      - run:
          name: Wait for PostgreSQL and check PostGIS
          command: |
            for i in $(seq 1 30); do pnpm --silent db:check && exit 0; sleep 2; done
            pnpm db:check
      - run:
          name: Apply migrations (twice, to prove they are idempotent)
          command: pnpm db:migrate && pnpm db:migrate
      - run:
          name: Fail if the Drizzle schema has changes without a migration
          command: |
            pnpm db:generate
            git status --porcelain apps/api/drizzle
            test -z "$(git status --porcelain apps/api/drizzle)"
      - run: pnpm test:e2e

  mobile-bundle:
    executor: node
    steps:
      - install
      - run:
          name: Bundle passenger and transport apps (Android + iOS JS only, no signing)
          command: pnpm turbo run export --filter=@vtp/passenger-mobile --filter=@vtp/transport-mobile
          environment:
            CI: '1'

  docker-images:
    # A VM: building and running images needs a real Docker daemon.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Validate production Compose file
          working_directory: infrastructure/docker/production
          command: |
            touch /tmp/api.env /tmp/pg.env
            VTP_WEB_DOMAIN=app.example.invalid VTP_API_DOMAIN=api.example.invalid \
            VTP_ACME_EMAIL=ci@example.invalid VTP_API_IMAGE=vtp-api:ci VTP_WEB_IMAGE=vtp-web:ci \
            VTP_API_ENV_FILE=/tmp/api.env VTP_POSTGRES_ENV_FILE=/tmp/pg.env \
              docker compose -f compose.yml --profile migrate config --quiet
      - run:
          name: Build API image
          command: docker build -f infrastructure/docker/production/api.Dockerfile -t vtp-api:ci .
      - run:
          name: Build web image
          command: >-
            docker build -f infrastructure/docker/production/web.Dockerfile
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid/api/v1 -t vtp-web:ci .
      - run:
          name: Smoke-test web image
          command: |
            docker run -d --name web -p 127.0.0.1:3000:3000 vtp-web:ci
            for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 2; done
            docker logs web; exit 1

workflows:
  ci:
    jobs:
      - quality
      - api-e2e
      - mobile-bundle
      - docker-images
