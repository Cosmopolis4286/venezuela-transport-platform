name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  # Build-time public config. Placeholders only — CI never talks to a real API.
  NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
  EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web and API
        run: pnpm build

  api-e2e:
    name: API e2e (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: vtp_ci
          POSTGRES_USER: vtp
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vtp -d vtp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_NAME: vtp_ci
      DATABASE_USER: vtp
      DATABASE_PASSWORD: ci-only-not-a-secret
      E2E_EXPECT_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check database connectivity and PostGIS
        run: pnpm db:check
      - name: Apply migrations (twice, to prove they are idempotent)
        run: pnpm db:migrate && pnpm db:migrate
      - name: Fail if the Drizzle schema has changes without a migration
        run: |
          pnpm db:generate
          git status --porcelain apps/api/drizzle
          test -z "$(git status --porcelain apps/api/drizzle)"
      - run: pnpm test:e2e

  mobile-bundle:
    name: Mobile JS bundles (no signing credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle passenger and transport apps (Android + iOS JS only)
        run: pnpm turbo run export --filter=@vtp/passenger-mobile --filter=@vtp/transport-mobile
        env:
          CI: '1'
