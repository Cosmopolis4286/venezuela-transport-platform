# LOCAL DEVELOPMENT only. Production lives elsewhere (see docs/deployment/vps-preparation.md)
# and must not reuse these defaults. Three ways to run the platform (docs/development/docker.md):
#
#   pnpm infra:up          # database only; API and web run on your machine (pnpm dev)
#   pnpm stack:api         # hybrid: database + API in Docker; run the frontends with pnpm dev:web,
#                          #         pnpm dev:passenger, pnpm dev:transport
#   pnpm stack:app         # everything in Docker: database + API + website (http://localhost:3000)
#   pnpm stack:down        # stop all of it (data is kept)
#   pnpm infra:up:redis    # + optional Redis (profile "redis")
#   pnpm infra:reset       # stop AND permanently delete local data (asks first)

name: vtp

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (run pnpm env:init)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: America/Caracas
      PGTZ: America/Caracas
    ports:
      # Bound to localhost only — not reachable from other machines on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # Runs once, only when the data volume is empty.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Applies the SQL migrations, then exits. The API starts only after it succeeds.
  migrate:
    profiles: ['api', 'app']
    image: vtp-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/production/api.Dockerfile
    command: ['node', 'dist/database/migrate.js']
    environment: &api-database
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # The production image of the API, with development settings: one-time codes printed to its
  # log (docker compose logs api) and simulated payments.
  api:
    profiles: ['api', 'app']
    image: vtp-api:local
    build:
      context: .
      dockerfile: infrastructure/docker/production/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-database
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,http://localhost:8082
      SWAGGER_ENABLED: 'true'
      # Placeholder for local use only; production refuses it.
      AUTH_SECRET: ${VTP_AUTH_SECRET:-change-me-local-only-dev-secret-0123456789}
      OTP_DELIVERY: console
      # E-mail goes to the log; set VTP_MAIL_DELIVERY=smtp (and run pnpm infra:up:mail) to read
      # it in Mailpit at http://localhost:8025.
      MAIL_DELIVERY: ${VTP_MAIL_DELIVERY:-console}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      PAYMENT_PROVIDER: simulated
      FILE_STORAGE_LOCAL_DIR: /app/var/uploads
    ports:
      # 127.0.0.1 by default. To test from a phone on your Wi-Fi, set VTP_API_PUBLISH_ADDRESS=0.0.0.0
      # in .env (trusted networks only).
      - '${VTP_API_PUBLISH_ADDRESS:-127.0.0.1}:${VTP_API_PORT:-4000}:4000'
    volumes:
      - api-uploads:/app/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The production image of the website. The browser calls the API on the host port; the
  # server side calls it over the Compose network.
  web:
    profiles: ['app']
    image: vtp-web:local
    build:
      context: .
      dockerfile: infrastructure/docker/production/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${VTP_WEB_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
    ports:
      - '127.0.0.1:${VTP_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:8.10-alpine
    profiles: ['redis']
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Development mail catcher: the API sends to SMTP port 1025 and nothing leaves the machine.
  # Read the messages at http://localhost:8025 (pnpm infra:up:mail).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['mail']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  api-uploads:
