# Local DEVELOPMENT infrastructure only. Production lives elsewhere
# (see docs/deployment/vps-preparation.md) and must not reuse these defaults.
#
#   pnpm infra:up          # PostgreSQL + PostGIS
#   pnpm infra:up:redis    # + optional Redis (profile "redis")
#   pnpm infra:down        # stop (data is kept)
#   pnpm infra:reset       # stop AND permanently delete local data (asks first)

name: vtp

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (run pnpm env:init)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: America/Caracas
      PGTZ: America/Caracas
    ports:
      # Bound to localhost only — not reachable from other machines on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      # Runs once, only when the data volume is empty.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    profiles: ['redis']
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
