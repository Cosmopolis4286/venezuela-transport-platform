# REFERENCE production stack for a single Linux VPS. Not used in development.
# Secrets live in env files OUTSIDE the repository (root-owned, chmod 600).
name: vtp-prod

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: '5'

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      VTP_WEB_DOMAIN: ${VTP_WEB_DOMAIN:?Set VTP_WEB_DOMAIN}
      VTP_API_DOMAIN: ${VTP_API_DOMAIN:?Set VTP_API_DOMAIN}
      VTP_ACME_EMAIL: ${VTP_ACME_EMAIL:?Set VTP_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging

  api:
    image: ${VTP_API_IMAGE:?Set VTP_API_IMAGE to an immutable git SHA tag}
    restart: unless-stopped
    env_file: ${VTP_API_ENV_FILE:-/etc/vtp/api.env}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      API_TRUST_PROXY_HOPS: '1'
      DATABASE_HOST: postgres
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_LOCAL_DIR: /app/var/uploads
    volumes:
      - api-uploads:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Run explicitly before api rollout: docker compose --profile migrate run --rm migrate
  migrate:
    image: ${VTP_API_IMAGE:?Set VTP_API_IMAGE}
    profiles: ['migrate']
    restart: 'no'
    env_file: ${VTP_MIGRATE_ENV_FILE:-/etc/vtp/migrate.env}
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
    command: ['node', 'dist/database/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  web:
    image: ${VTP_WEB_IMAGE:?Set VTP_WEB_IMAGE to an immutable git SHA tag}
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
    logging: *logging

  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    env_file: ${VTP_POSTGRES_ENV_FILE:-/etc/vtp/postgres.env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/20-init-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *logging

volumes:
  api-uploads:
  postgres-data:
  caddy-data:
  caddy-config:
